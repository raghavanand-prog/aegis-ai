name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch cancels the first: CI should report on the
# current code, not queue up runs of code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegisx
          POSTGRES_PASSWORD: aegisx
          POSTGRES_DB: aegisx_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegisx -d aegisx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        # SQLite keeps the suite fast and hermetic; the PostgreSQL service above
        # is what the migration check runs against.
        run: pytest

      - name: Migrations upgrade and downgrade
        # A migration that cannot be rolled back is a migration you cannot
        # deploy on a Friday.
        env:
          DATABASE_URL: postgresql+psycopg://aegisx:aegisx@localhost:5432/aegisx_ci
          JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Train the anomaly model
        # Trained in CI rather than committed: model binaries do not belong in
        # version control, and a seeded training run is reproducible. This also
        # proves a fresh clone can produce the model from source.
        env:
          DATABASE_URL: postgresql+psycopg://aegisx:aegisx@localhost:5432/aegisx_ci
          JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          ML_MODEL_DIR: ${{ runner.temp }}/ml-artifacts
        run: |
          python -m app.ml.training.train_anomaly_model --samples 3000 --max-seconds 600

      - name: Hybrid detection evaluation
        # Measures rules, ML and both over the labelled dataset. No threshold is
        # enforced on the ML rows: the dataset was built to exercise rule
        # thresholds, so an ML gate here would be gating on the wrong data.
        # See docs/EVALUATION.md.
        env:
          DATABASE_URL: postgresql+psycopg://aegisx:aegisx@localhost:5432/aegisx_ci
          JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          ML_MODEL_DIR: ${{ runner.temp }}/ml-artifacts
          EVALUATION_REPORTS_DIR: ${{ runner.temp }}/eval-reports
        run: |
          python -m app.ml.evaluation.run_ml_eval --require-model --max-seconds 600

      - name: Detection evaluation
        # Runs the real evaluation and fails the build if detection quality
        # regresses past the agreed floor. Thresholds are deliberately below
        # the current measurement so ordinary noise does not break CI.
        run: |
          python -m app.evaluation.run_detection_eval \
            --format text \
            --output-dir "${RUNNER_TEMP}/eval-reports" \
            --fail-under-f1 0.85 \
            --fail-over-fpr 0.10 \
            --max-seconds 600

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-evaluation
          path: ${{ runner.temp }}/eval-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Component tests
        run: npm run test

      - name: Production build
        run: npm run build

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aegisx-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t aegisx-frontend:ci ./frontend
